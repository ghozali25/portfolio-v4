name: keep-supabase-alive

on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Auth health
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://fukwqchnqhvtdcebdzab.supabase.co/auth/v1/health"

      - name: Ping Storage health
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://fukwqchnqhvtdcebdzab.supabase.co/storage/v1/health"

      - name: Ping Realtime
        run: |
          curl --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Connection: keep-alive" \
            "https://fukwqchnqhvtdcebdzab.supabase.co/realtime/v1/" || true

      - name: Ping PostgREST lightweight select
        run: |
          curl --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://fukwqchnqhvtdcebdzab.supabase.co/rest/v1/?select=1" || true
