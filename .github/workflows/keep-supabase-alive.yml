name: keep-supabase-alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      SUPA: ${{ secrets.SUPABASE_ANON_KEY }}
      URL: https://fukwqchnqhvtdcebdzab.supabase.co

    steps:
      - name: Auth gateway
        run: |
          curl --fail -s \
            -H "apikey: $SUPA" \
            -H "Authorization: Bearer $SUPA" \
            "$URL/auth/v1/health"

      - name: Wake DB (projects)
        run: |
          curl --fail -s \
            -H "apikey: $SUPA" \
            -H "Authorization: Bearer $SUPA" \
            "$URL/rest/v1/projects?select=id&limit=1"

      - name: Wake DB (certificates)
        run: |
          curl --fail -s \
            -H "apikey: $SUPA" \
            "$URL/rest/v1/certificates?select=id&limit=1"

      - name: Storage check (non critical)
        run: |
          curl -s \
            -H "apikey: $SUPA" \
            "$URL/storage/v1/health" || true
