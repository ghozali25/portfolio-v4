name: keep-supabase-alive

on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Auth health
        run: |
          curl --fail --silent --show-error \
            "https://fukwqchnqhvtdcebdzab.supabase.co/auth/v1/health"
      - name: Ping Storage health
        run: |
          curl --fail --silent --show-error \
            "https://fukwqchnqhvtdcebdzab.supabase.co/storage/v1/health"
      - name: Ping Realtime (optional)
        run: |
          curl --silent --show-error \
            -H "Connection: keep-alive" \
            "https://fukwqchnqhvtdcebdzab.supabase.co/realtime/v1/" || true
      - name: Ping PostgREST lightweight select (optional)
        run: |
          curl --silent --show-error \
            -H "apikey: sb_publishable_9tnkU8l7Q055GFJgRsb4zw_z3mco425" \
            -H "Authorization: Bearer sb_publishable_9tnkU8l7Q055GFJgRsb4zw_z3mco425" \
            "https://fukwqchnqhvtdcebdzab.supabase.co/rest/v1/?select=1" || true
